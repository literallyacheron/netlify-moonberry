<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonberrySMP Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@400;700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="wrap">
    <header class="topbar page-title">
      <h1 style="font-size:inherit">MoonberrySMP Control Panel</h1>
      <button class="shimmer-button-normal" id="logout" type="button">Log out</button>
    </header>
    <section class="player" aria-live="polite">
      <div class="skin"><iframe id="craftyEmbed" title="Player skin" loading="lazy" hidden></iframe></div>
      <h4 id="name">Loading…</h4>
    </section>
    <dl class="stats">
      <div><dt>Chestshops:</dt><dd id="shops">…</dd></div>
      <div><dt>Playerwarps:</dt><dd id="warps">…</dd></div>
    </dl>
    <p class="msg err" id="msg" role="alert"></p>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    async function load() {
      try {
        const res = await fetch('/api/me');
        if (res.status === 401) return location.replace('login.html');
        const d = await res.json().catch(() => { throw new Error(`The API answered with HTTP ${res.status} instead of JSON. The Netlify function is not running at /api.`); });
        if (!res.ok) throw new Error(d.error);
        $('name').textContent = d.username;
        $('shops').textContent = d.chestshops;
        $('warps').textContent = d.playerwarps;
        // Bedrock names carry a prefix; skins come from the Java name underneath it.
        const javaName = encodeURIComponent(d.username.replace(/^_/, ''));
        const f = $('craftyEmbed');
        f.src = `https://crafty.gg/embed/player/${javaName}?accent=magenta&capes=0&location=0&bio=0&uuid=0&first_seen=0&locator=off&view=bust`;
        f.hidden = false;
      } catch (err) {
        $('name').textContent = 'Unavailable';
        $('shops').textContent = $('warps').textContent = '–';
        $('msg').textContent = err.message || 'Could not load your data.';
      }
    }
    $('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('login.html');
    });
    load();
  </script>
</body>
</html>
